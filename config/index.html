<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>我的常用导航</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html { 
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body{
      background: #0a0a0a; /* 兜底纯色，防止图片加载失败黑屏 */
      background-position: center center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      background-size: cover;
      color: #fff;
      padding: 1rem;
      max-width: 1200px;
      margin: 0 auto;
      font-family: Arial, sans-serif; /* 老浏览器兼容字体，去掉不认识的system-ui */
      overflow-x: hidden;
    }

/* 🔥 顶部滚动发光文字 - 全部保留，老浏览器支持 */
    .marquee {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      overflow: hidden;
      background: rgba(0,0,0,0.4); /* 加个半透明背景，防止文字看不清 */
      padding: 6px 0;
      z-index: 999;
    }
    .marquee-inner {
      display: inline-block;
      white-space: nowrap;
      font-size: 15px; /* 去掉不兼容的clamp()，用固定大小 */
      font-weight: bold;
      /* 保留所有文字动画，老浏览器完全支持 */
      animation: marquee 20s linear infinite, glow 1.2s ease-in-out infinite alternate, colorLoop 8s linear infinite;
    }
    @keyframes marquee {
      0% { transform: translateX(100vw); }
      100% { transform: translateX(-100%); }
    }
    @keyframes glow {
      from { text-shadow: 0 0 5px #fff, 0 0 10px #fff; }
      to { text-shadow: 0 0 15px #fff, 0 0 30px #fff; }
    }
    @keyframes colorLoop {
      0% { color: #fff; }
      20% { color: #4ade80; }
      40% { color: #60a5fa; }
      60% { color: #f472b6; }
      80% { color: #fbbf24; }
      100% { color: #fff; }
    }

    /* ====================================== */
    /* 删掉会卡死老浏览器的星空、波浪特效 */
    #stars, .wave, .wave1, .wave2, .wave3 {
      display: none !important;
    }
    /* ====================================== */

    .title{
      text-align: center;
      font-size: 22px; /* 去掉不兼容的rem/clamp */
      margin: 30px 0 20px;
      color: #fff;
      text-shadow: 0 0 10px rgba(0,0,0,0.7);
    }

    .card {
      background: transparent;
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 18px;
    }

    .card h2 {
      font-size: 18px; /* 去掉不兼容的rem */
      color: #fff;
      margin-bottom: 1rem;
      border-left: 4px solid #4ade80;
      padding-left: 8px;
      text-shadow: 0 0 6px rgba(0,0,0,0.8);
    }

    /* 老浏览器不支持Grid，换成兼容的inline-block布局 */
    .grid {
      display: block;
      text-align: center;
    }
    .item {
      display: inline-block;
      background: transparent;
      color: #fff;
      padding: 16px 12px;
      font-size: 16px; /* 去掉不兼容的clamp */
      text-align: center;
      border-radius: 8px;
      text-decoration: none;
      text-shadow: 0 0 6px rgba(0,0,0,0.8);
      transition: 0.3s ease;
      position: relative;
      overflow: hidden;
      width: 120px;
      margin: 5px;
    }
    .item:hover {
      background: #4ade80;
      color: #000;
      text-shadow: none;
      transform: scale(1.05);
      box-shadow: 0 0 12px rgba(74, 222, 128, 0.4);
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      transform: scale(0);
      animation: ripple 0.6s linear;
      pointer-events: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes ripple {
      to { transform: scale(4); opacity: 0; }
    }

/* 系统信息面板 - 去掉不兼容的backdrop-filter */
.info-modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7); /* 加深背景，代替磨砂玻璃 */
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  display: none;
}
.info-box {
  background: rgba(20, 20, 30, 0.95);
  color: #fff;
  padding: 22px 24px;
  border-radius: 16px;
  width: 90%;
  max-width: 380px;
  border: 1px solid rgba(255,255,255,0.15);
  box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  font-size: 14px;
  line-height: 1.6;
  position: relative;
}
.info-box h3 {
  margin: 0 0 12px;
  color: #4ade80;
  font-size: 18px;
}
.info-close {
  position: absolute;
  top: 14px;
  right: 16px;
  color: #ccc;
  cursor: pointer;
  font-size: 18px;
}
.info-close:hover {
  color: #fff;
}
  </style>

  <script async src="https://umami.is/script.js" data-website-id="这里替换成你自己的ID"></script>
</head>

<body>
<!-- 🔥 顶部滚动欢迎文字 -->
<div class="marquee">
  <div class="marquee-inner">欢迎进入 · 常用导航 · 祝您使用愉快</div>
</div>
<!-- 删掉会卡死的星空Canvas -->
<!-- <canvas id="stars"></canvas> -->

<h1 class="title">🔖 我的常用导航</h1>

<div class="card">
  <h2>💼 工作效率</h2>
  <div class="grid">
    <a class="item" href="https://www.baidu.com" target="_blank">百度</a>
    <a class="item" href="https://github.com" target="_blank">GitHub</a>
    <a class="item" href="https://etax.texndnel.com/" target="_blank">Tax</a>
  </div>
</div>

<div class="card">
  <h2>🎬 娱乐</h2>
  <div class="grid">
    <a class="item" href="https://www.bilibili.com" target="_blank">B站</a>
    <a class="item" href="https://www.youtube.com" target="_blank">YouTube</a>
  </div>
</div>
<div class="card">
  <h2>🛠️ 工具</h2>
    <div class="grid">
      <a class="item" href="https://tools.upx8.com/ip/" target="_blank">iptool</a>
    <a class="item" onclick="showInfo()">系统信息</a>
  </div>
</div>

<script>
  const bgImages = [
    "https://picsum.photos/id/1043/1920/1080",
    "https://wp.upx8.com/api.php"
  ];
  const randomBg = bgImages[Math.floor(Math.random() * bgImages.length)];
  document.body.style.backgroundImage = "url(" + randomBg + ")";

  // ======================================
  // 删掉会报错的星空JS代码（你原来的代码里变量都没定义，直接报错卡死）
  // ======================================

function showInfo() {
  let info = '';
  const ua = navigator.userAgent;

  // 1.浏览器版本 - 删掉不兼容的可选链?.，换成老浏览器支持的普通判断
let browser = '未知浏览器';
if (ua.indexOf('Edg') !== -1) {
  let match = ua.match(/Edg\/([\d.]+)/);
  let v = match ? match[1] : '';
  browser = 'Edge ' + v.replace(/\.0\.0\.0$/, '');
} else if (ua.indexOf('Chrome') !== -1) {
  let match = ua.match(/Chrome\/([\d.]+)/);
  let v = match ? match[1] : '';
  browser = 'Chrome ' + v.replace(/\.0\.0\.0$/, '');
} else if (ua.indexOf('Firefox') !== -1) {
  let match = ua.match(/Firefox\/([\d.]+)/);
  let v = match ? match[1] : '';
  browser = 'Firefox ' + v;
} else if (ua.indexOf('Safari') !== -1 && ua.indexOf('Chrome') === -1) {
  let match = ua.match(/Version\/([\d.]+)/);
  let v = match ? match[1] : '';
  browser = 'Safari ' + v;
} else if (ua.indexOf('OPR') !== -1 || ua.indexOf('Opera') !== -1) {
  let match = ua.match(/OPR\/([\d.]+)/);
  let v = match ? match[1] : '';
  browser = 'Opera ' + v;
} else if (ua.indexOf('Via') !== -1) {
  let match = ua.match(/Via\/([\d.]+)/);
  let v = match ? match[1] : '';
  browser = 'Via ' + v;
}

  // 2. 分辨率信息
  const dpr = window.devicePixelRatio || 1;
  const logicalWidth = screen.width;
  const logicalHeight = screen.height;
  const physicalWidth = Math.round(logicalWidth * dpr);
  const physicalHeight = Math.round(logicalHeight * dpr);
  const scalePercent = Math.round(dpr * 100) + '%';

  // 3. 系统识别
let osArch = '未知系统';
if (navigator.platform.indexOf('Win') !== -1) {
  if (ua.indexOf('Windows NT 11.0') !== -1) {
    osArch = 'Windows 11 64位';
  } else if (ua.indexOf('Windows NT 10.0') !== -1) {
    osArch = 'Windows 10 64位';
  } else if (ua.indexOf('Windows NT 6.3') !== -1) {
    osArch = 'Windows 8.1';
  } else if (ua.indexOf('Windows NT 6.2') !== -1) {
    osArch = 'Windows 8';
  } else if (ua.indexOf('Windows NT 6.1') !== -1) {
    osArch = 'Windows 7';
  } else {
    osArch = (ua.indexOf('Win64') !== -1 || ua.indexOf('x64') !== -1) ? 'Windows 64位' : 'Windows 32位(浏览器)';
  }
} 
else if (navigator.platform.indexOf('Android') !== -1 || ua.indexOf('Android') !== -1) {
  let match = ua.match(/Android (\d+)/);
  osArch = match ? `Android ${match[1]}` : 'Android';
} 
else if (navigator.platform.indexOf('iPhone') !== -1 || ua.indexOf('iPhone') !== -1) {
  let match = ua.match(/OS (\d+)_/);
  osArch = match ? `iOS ${match[1]}` : 'iOS';
} 
else if (navigator.platform.indexOf('Mac') !== -1) {
  let match = ua.match(/Mac OS X (\d+_\d+)/);
  let macVer = match ? match[1].replace(/_/g, '.') : '';
  osArch = macVer ? `macOS ${macVer}` : 'macOS';
} 
else if (navigator.platform.indexOf('Linux') !== -1) {
  osArch = 'Linux';
}

  // 4. 刷新率
  let refreshRate = '60Hz (估算)';
  if (window.screen && window.screen.refreshRate) {
    refreshRate = window.screen.refreshRate + 'Hz';
  }

  // 5. 显卡信息
  let gpuInfo = '未知';
  try {
    const canvas = document.createElement('canvas');
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    if (gl) {
      const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
      if (debugInfo) {
        gpuInfo = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
        if (gpuInfo.length > 30) gpuInfo = gpuInfo.substring(0, 30) + '...';
      }
    }
  } catch (e) {}

  // 组装信息
  info += '【设备信息】\n';
  info += '浏览器: ' + browser + '\n';
  info += '系统: ' + osArch + '\n';
  info += '物理分辨率: ' + physicalWidth + ' × ' + physicalHeight + '\n';
  info += '逻辑分辨率: ' + logicalWidth + ' × ' + logicalHeight + '\n';
  info += '系统缩放: ' + scalePercent + '\n';
  info += '屏幕刷新率: ' + refreshRate + '\n';
  info += '颜色深度: ' + screen.colorDepth + '位\n';
  info += "CPU 线程数: " + navigator.hardwareConcurrency + "核\n";
  info += '显卡: ' + gpuInfo + '\n\n';

  info += '【网络状态】\n';
  info += '在线状态: ' + (navigator.onLine ? '已连接' : '未连接') + '\n';
  if (navigator.connection) {
    info += '网络类型: ' + (navigator.connection.effectiveType || '未知') + '\n';
  }
  info += '\n';

  info += '【浏览器标识】\n';
  info += ua.substring(0, 120) + '...\n\n';

  info += '【电池状态】\n加载中...\n\n';
  info += '【IP 位置】\n加载中...\n';

  const contentEl = document.getElementById('infoContent');
  contentEl.innerText = info;
  document.getElementById('infoModal').style.display = 'flex';

  // 电池信息 - 删掉不存在的health字段
  if (navigator.getBattery) {
    navigator.getBattery().then(function(b) {
      let txt = `【电池状态】\n电量: ${Math.round(b.level*100)}% ${b.charging?'(充电中)':'(未充电)'}\n\n`;
      contentEl.innerText = contentEl.innerText.replace(/【电池状态】[\s\S]*?\n\n/, txt);
    }).catch(function(){});
  }

  // IP定位
function loadIP() {
 fetch('http://ip-api.com/json/?fields=61439')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      const ip = d.query || '未知';
      const region = d.regionName || '未知';
      const city = d.city || '未知';
      const isp = d.isp || '未知';
      const txt = `【IP 位置】\nIP: ${ip}\n地区: ${region}\n城市: ${city}\n运营商: ${isp}`;
      contentEl.innerText = contentEl.innerText.replace(/【IP 位置】[\s\S]*$/, txt);
    })
    .catch(function() {
      fetch('https://api64.ipify.org?format=json')
        .then(function(r){ return r.json(); })
        .then(function(d){
          const txt = `【IP 位置】\nIP: ${d.ip || '未知'}\n地区: 仅IP`;
          contentEl.innerText = contentEl.innerText.replace(/【IP 位置】[\s\S]*$/, txt);
        });
    });
}

  loadIP();
}
function closeInfo() {
  document.getElementById('infoModal').style.display = 'none';
}
</script>
</body>
<div class="info-modal" id="infoModal" onclick="if(event.target==this) closeInfo()">
  <div class="info-box" onclick="event.stopPropagation()">
    <div class="info-close" onclick="closeInfo()">×</div>
    <h3>📟 系统信息</h3>
    <pre id="infoContent" style="white-space: pre-wrap; margin:0;"></pre>
  </div>
</div>
</html>
